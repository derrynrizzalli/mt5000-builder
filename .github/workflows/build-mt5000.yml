name: Build OpenWrt for GL.iNet GL-MT5000 (Brume 3)

# Builds firmware from the community fork nathanli1211/openwrt_mt5000
# (glinet-mt5000 branch) on GitHub's free runners.
# Run it manually from the Actions tab -> "Run workflow".

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Free up disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Check out the MT5000 source fork
        uses: actions/checkout@v4
        with:
          repository: nathanli1211/openwrt_mt5000
          ref: glinet-mt5000

      - name: Update and install package feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add custom files (unbound cache persistence)
        run: |
          mkdir -p files/etc/init.d files/etc/uci-defaults

          cat > files/etc/init.d/unbound-cache <<'SCRIPT'
          #!/bin/sh /etc/rc.common
          # Persist unbound's DNS cache across restarts/reboots/power loss.
          # START must run after unbound (START=19); STOP must run before
          # unbound stops (STOP=50), so the cache is still readable.

          START=95
          STOP=05

          CACHE_FILE=/etc/unbound/cache.dump
          LOG_TAG=unbound-cache

          EXTRA_COMMANDS="dump load"
          EXTRA_HELP="        dump    Dump unbound's cache to disk now
                  load    Load unbound's cache from disk now"

          dump() {
                  if unbound-control dump_cache > "$CACHE_FILE.tmp" 2>/dev/null; then
                          mv "$CACHE_FILE.tmp" "$CACHE_FILE"
                          logger -t "$LOG_TAG" "cache dumped ($(wc -c < "$CACHE_FILE") bytes)"
                  else
                          rm -f "$CACHE_FILE.tmp"
                          logger -t "$LOG_TAG" "cache dump failed (unbound-control not responding)"
                  fi
          }

          load() {
                  [ -s "$CACHE_FILE" ] || return 0
                  local i=0
                  while ! unbound-control status >/dev/null 2>&1; do
                          i=$((i + 1))
                          [ "$i" -ge 20 ] && { logger -t "$LOG_TAG" "unbound not ready after 20s, skipping cache load"; return 1; }
                          sleep 1
                  done
                  if unbound-control load_cache < "$CACHE_FILE" 2>/dev/null; then
                          logger -t "$LOG_TAG" "cache loaded from $CACHE_FILE"
                  else
                          logger -t "$LOG_TAG" "cache load failed"
                  fi
          }

          start() {
                  load
          }

          stop() {
                  dump
          }
          SCRIPT
          chmod +x files/etc/init.d/unbound-cache

          cat > files/etc/uci-defaults/99-unbound-cache <<'DEFAULTS'
          #!/bin/sh
          # Runs once on first boot after flashing, then deletes itself.

          chmod +x /etc/init.d/unbound-cache
          /etc/init.d/unbound-cache enable

          # Hourly safety-net dump, in case of crash/power loss (no clean shutdown)
          grep -q unbound-cache /etc/crontabs/root 2>/dev/null || \
                  echo '0 * * * * /etc/init.d/unbound-cache dump' >> /etc/crontabs/root
          /etc/init.d/cron enable
          /etc/init.d/cron restart 2>/dev/null

          # Match the known-good prometheus-node-exporter-lua config (LAN-reachable,
          # not the loopback-only default)
          uci set prometheus-node-exporter-lua.main=prometheus-node-exporter-lua
          uci set prometheus-node-exporter-lua.main.listen_interface='lan'
          uci set prometheus-node-exporter-lua.main.listen_port='9100'
          uci commit prometheus-node-exporter-lua

          exit 0
          DEFAULTS
          chmod +x files/etc/uci-defaults/99-unbound-cache

      - name: Configure the build for GL-MT5000
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=7000
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_unbound-daemon=y
          CONFIG_PACKAGE_unbound-control=y
          CONFIG_PACKAGE_luci-app-unbound=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_kmod-ip6tables=y
          CONFIG_PACKAGE_kmod-ipt-core=y
          CONFIG_PACKAGE_kmod-ipt-ipset=y
          CONFIG_PACKAGE_kmod-ipt-conntrack-extra=y
          CONFIG_PACKAGE_kmod-ipt-ipopt=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_ip6tables-nft=y
          CONFIG_PACKAGE_iptables-mod-conntrack-extra=y
          CONFIG_PACKAGE_iptables-mod-ipopt=y
          CONFIG_PACKAGE_iptables-mod-nat-extra=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_prometheus-node-exporter-lua=y
          CONFIG_PACKAGE_vnstat=y
          CONFIG_PACKAGE_vnstati=y
          CONFIG_PACKAGE_luci-app-vnstat=y
          CONFIG_PACKAGE_cron=y
          EOF
          make defconfig
          # Fail fast if the device profile did not stick
          grep -q 'CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000=y' .config

      - name: Cache downloaded source tarballs
        uses: actions/cache@v4
        with:
          path: dl
          key: mt5000-dl-${{ hashFiles('.config') }}
          restore-keys: |
            mt5000-dl-

      - name: Download source packages
        run: make download -j$(nproc) || make download -j1

      - name: Build firmware (takes 2-4 hours)
        run: make -j$(nproc) world || make -j1 V=s world

      - name: Show build results and disk usage
        if: always()
        run: |
          df -h /
          ls -lh bin/targets/mediatek/filogic/ || true

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-gl-mt5000-firmware
          retention-days: 30
          path: |
            bin/targets/mediatek/filogic/*.bin
            bin/targets/mediatek/filogic/*.manifest
            bin/targets/mediatek/filogic/sha256sums
            bin/targets/mediatek/filogic/config.buildinfo

      - name: Assemble a self-hosted package repo matching this exact build
        run: |
          echo "--- bin/targets/mediatek/filogic contents (2 levels) ---"
          find bin/targets/mediatek/filogic -maxdepth 2
          echo "--- bin/packages contents (2 levels) ---"
          find bin/packages -maxdepth 2

          mkdir -p pages-repo/targets/mediatek/filogic pages-repo/packages

          if [ -d bin/targets/mediatek/filogic/packages ]; then
            cp -r bin/targets/mediatek/filogic/packages pages-repo/targets/mediatek/filogic/
          else
            echo "WARNING: bin/targets/mediatek/filogic/packages not found, skipping"
          fi

          if [ -d bin/targets/mediatek/filogic/kmods ]; then
            cp -r bin/targets/mediatek/filogic/kmods pages-repo/targets/mediatek/filogic/
          else
            echo "WARNING: bin/targets/mediatek/filogic/kmods not found, skipping (see directory listing above)"
          fi

          if [ -d bin/packages/aarch64_cortex-a53 ]; then
            cp -r bin/packages/aarch64_cortex-a53 pages-repo/packages/
          else
            echo "WARNING: bin/packages/aarch64_cortex-a53 not found, skipping"
          fi

          du -sh pages-repo || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-repo

  publish-package-repo:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy package repo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
